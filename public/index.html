<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>モリノミカタ(β)</title>
<link rel="stylesheet" href="tokens.css">
<style>
  :root { --line:#ddd; --muted:#666; --warn:#a33; --ok:#161; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; color: #222;
         display: flex; flex-direction: column; }

  #topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px;
            border-bottom: 1px solid var(--line); flex: none; }
  #topbar .menu-link { font-size: 12px; color: var(--muted); text-decoration: none; flex: none; }
  #topbar h1 { font-size: 16px; margin: 0; flex: 1; text-align: center; }
  #topbar h1 .beta { font-size: 11px; color: var(--muted); font-weight: 400;
                      border: 1px solid var(--line); border-radius: 999px; padding: 1px 6px; }
  #login-link { font-size: 12px; color: #1a4d73; text-decoration: none; flex: none; }

  #char-area { flex: none; min-height: 38vh; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 8px;
               background: linear-gradient(180deg, #eef5f0, #fff); padding: 16px; }
  #char-sprite { font-size: 88px; line-height: 1; }
  #char-level { font-size: 18px; font-weight: 700; }
  .xp-bar { width: 220px; height: 10px; border-radius: 999px; background: #e3e3df;
            overflow: hidden; }
  .xp-bar-fill { height: 100%; background: #1a5c3a; border-radius: 999px;
                 transition: width .3s ease; }
  #xp-label { font-size: 12px; color: var(--muted); }

  #action-wrap { flex: none; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .action-btn { display: block; width: 100%; padding: 14px; font-size: 16px; font-weight: 700;
                color: #fff; border: 0; border-radius: 999px; cursor: pointer;
                text-decoration: none; text-align: center; }
  .action-btn.primary { background: #1a5c3a; }
  .action-btn.primary:active { background: #164a30; }
  .action-btn.secondary { background: #1a4d73; }
  .action-btn.secondary:active { background: #163f5e; }
  #action-desc { font-size: 12px; color: var(--muted); margin: 4px 0 0; text-align: center; }

  #triage-area { flex: 1; display: flex; flex-direction: column; align-items: center;
                 justify-content: center; padding: 16px; gap: 12px; position: relative; }
  #triage-area[hidden] { display: none; }
  #triage-status { font-size: 14px; color: var(--muted); text-align: center; }
  #triage-card { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; }
  #triage-card[hidden] { display: none; }
  #triage-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 12px;
                background: #eee; display: block; }
  .triage-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .triage-buttons button { padding: 14px 8px; font-size: 14px; border: 1px solid var(--line);
                            border-radius: 10px; background: #fff; cursor: pointer; }
  .triage-buttons button:disabled { color: #bbb; cursor: default; }
  .triage-buttons button.skip { grid-column: 1 / -1; color: var(--muted); background: none;
                                 border-style: dashed; }
  #triage-close { color: var(--muted); background: none; border: none; text-decoration: underline;
                  padding: 6px; font-size: 13px; cursor: pointer; }

  .xp-toast { position: absolute; top: 8px; left: 50%; transform: translate(-50%, -8px);
              font-size: 15px; font-weight: 700; color: #1a5c3a; background: #eef5f0;
              border: 1px solid #cfe3d8; border-radius: 999px; padding: 6px 16px;
              opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; }
  .xp-toast.show { opacity: 1; transform: translate(-50%, 0); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex;
                     align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .modal-backdrop[hidden] { display: none; }
  #levelup-modal .modal-card { background: #fff; border-radius: 16px; max-width: 320px; width: 100%;
                                padding: 28px 20px; text-align: center; }
  #levelup-title { font-size: 18px; font-weight: 700; margin: 0 0 12px; color: #1a5c3a; }
  #levelup-sprite { font-size: 72px; line-height: 1; margin: 0 0 8px; }
  #levelup-level { font-size: 22px; font-weight: 700; margin: 0 0 20px; }
  #levelup-modal .modal-card .action-btn { margin-top: 8px; }

  footer { flex: none; padding: 12px 16px; }
  footer .note { font-size: 11px; color: var(--muted); margin: 0 0 8px; text-align: center; }
  footer .menu-link { display: block; text-align: center; font-size: 12px; color: var(--muted);
                       text-decoration: none; }
  footer .menu-link:hover { color: #222; }
</style>
<body>

<div id="topbar">
  <a class="menu-link" href="menu.html">☰ メニュー</a>
  <h1>モリノミカタ <span class="beta">β</span></h1>
  <a id="login-link" href="#">ログイン</a>
</div>

<section id="char-area">
  <div id="char-sprite">🥚</div>
  <div id="char-level">Lv.1</div>
  <div class="xp-bar"><div class="xp-bar-fill" id="xp-fill" style="width:0%"></div></div>
  <div id="xp-label">0 / 20 XP</div>
</section>

<div id="action-wrap">
  <a href="report.html" class="action-btn primary">📷 ヨソモンを記録する</a>
  <button type="button" id="start-btn" class="action-btn secondary">🔍 写真を判定する</button>
  <p id="action-desc">外来種「ヨソモン」を見つけて記録すると、相棒のキツツキが育ちます</p>
</div>

<section id="triage-area" hidden>
  <p id="triage-status"></p>
  <div id="triage-card" hidden>
    <img id="triage-img" alt="判定対象の写真">
    <div class="triage-buttons">
      <button type="button" data-choice="tree">🌳 木っぽい</button>
      <button type="button" data-choice="evidence">🪵 証拠あり</button>
      <button type="button" data-choice="irrelevant">❌ 無関係</button>
      <button type="button" data-choice="skip" class="skip">🤷 わからない</button>
    </div>
  </div>
  <p class="xp-toast" id="xp-toast"></p>
  <button type="button" id="triage-close" class="close-triage">判定をやめる</button>
</section>

<footer>
  <p class="note">表示される写真は位置情報・投稿者情報を含まないサムネイルのみです。
    最終判定は自治体の担当者が行います。相棒のビジュアルは仮のものです。</p>
  <a class="menu-link" href="menu.html">🗺️ 被害マップ・マイページはこちら</a>
</footer>

<div id="levelup-modal" class="modal-backdrop" hidden>
  <div class="modal-card">
    <p id="levelup-title">🎉 レベルアップ!</p>
    <div id="levelup-sprite">🐣</div>
    <p id="levelup-level">Lv.2</p>
    <button type="button" id="levelup-share" class="action-btn secondary">📤 シェア</button>
    <button type="button" id="levelup-close" class="action-btn primary">つづける</button>
  </div>
</div>

<script type="module">
import { getReporterId, bootstrapAuth, googleLoginUrl } from './auth.js';

const $ = (id) => document.getElementById(id);
let reporterId = getReporterId();
const authReady = bootstrapAuth().then((r) => { reporterId = r.reporterId; });

// 本物のアート素材が無いための暫定ビジュアル(レベル帯で絵文字が変わるだけ)。
const LEVEL_SPRITES = [
  { min: 1, max: 2, emoji: '🥚' },
  { min: 3, max: 5, emoji: '🐣' },
  { min: 6, max: 9, emoji: '🐥' },
  { min: 10, max: Infinity, emoji: '🦅' },
];
function spriteForLevel(level) {
  return (LEVEL_SPRITES.find((s) => level >= s.min && level <= s.max) || LEVEL_SPRITES[0]).emoji;
}

let lastLevel = 1;
let shareLevel = 1;

function renderCharacter(j) {
  $('char-sprite').textContent = spriteForLevel(j.level);
  $('char-level').textContent = `Lv.${j.level}`;
  const pct = Math.round((j.xp_into_level / j.xp_for_next_level) * 100);
  $('xp-fill').style.width = `${pct}%`;
  $('xp-label').textContent = `${j.xp_into_level} / ${j.xp_for_next_level} XP`;
  lastLevel = j.level;
}

// --- 手応え(紙吹雪・チャイム音・触覚)。いずれも外部アセット不要、非対応環境は自然にno-op ---
function vibrate(pattern) {
  try { navigator.vibrate?.(pattern); } catch { /* 非対応環境は無視 */ }
}

function fireConfetti() {
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:30;';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#1a5c3a', '#1a4d73', '#eda100', '#e34948', '#4a3aa7'];
  const pieces = Array.from({ length: 70 }, () => ({
    x: Math.random() * canvas.width, y: -20 - Math.random() * canvas.height * 0.3,
    size: 4 + Math.random() * 5, color: colors[Math.floor(Math.random() * colors.length)],
    vy: 2 + Math.random() * 3, vx: (Math.random() - 0.5) * 2,
    rot: Math.random() * Math.PI, vrot: (Math.random() - 0.5) * 0.3,
  }));
  const start = performance.now();
  function frame(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of pieces) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }
    if (t - start < 1800) requestAnimationFrame(frame);
    else canvas.remove();
  }
  requestAnimationFrame(frame);
}

function playChime() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    [523.25, 659.25, 783.99].forEach((freq, i) => { // C5-E5-G5の軽い上昇アルペジオ
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t0 = ctx.currentTime + i * 0.1;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.35);
    });
    setTimeout(() => ctx.close(), 800);
  } catch { /* 音が鳴らなくても致命的ではない */ }
}

async function shareCard(level, emoji) {
  const canvas = document.createElement('canvas');
  canvas.width = 600; canvas.height = 700;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#eef5f0';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#1a5c3a';
  ctx.font = 'bold 32px sans-serif';
  ctx.fillText('モリノミカタ', canvas.width / 2, 80);
  ctx.font = '180px sans-serif';
  ctx.fillText(emoji, canvas.width / 2, 380);
  ctx.font = 'bold 48px sans-serif';
  ctx.fillStyle = '#222';
  ctx.fillText(`Lv.${level}`, canvas.width / 2, 470);
  ctx.font = '20px sans-serif';
  ctx.fillStyle = '#666';
  ctx.fillText('外来種ヨソモンを見つけて相棒を育てよう', canvas.width / 2, 540);

  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
  if (!blob) return;
  const file = new File([blob], 'monimikata.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'モリノミカタ', text: `Lv.${level}になりました!` });
      return;
    } catch { /* ユーザーがキャンセルした場合など。ダウンロードにフォールバック */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'monimikata.png';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function showLevelUp(prevLevel, newLevel) {
  const evolved = spriteForLevel(newLevel) !== spriteForLevel(prevLevel);
  $('levelup-title').textContent = evolved ? '🎉 相棒が進化した!' : '🎉 レベルアップ!';
  $('levelup-sprite').textContent = spriteForLevel(newLevel);
  $('levelup-level').textContent = `Lv.${newLevel}`;
  $('levelup-modal').hidden = false;
  shareLevel = newLevel;
  fireConfetti();
  playChime();
  vibrate([40, 30, 40, 30, 80]);
}
$('levelup-close').addEventListener('click', () => { $('levelup-modal').hidden = true; });
$('levelup-modal').addEventListener('click', (e) => {
  if (e.target === $('levelup-modal')) $('levelup-modal').hidden = true;
});
$('levelup-share').addEventListener('click', () => shareCard(shareLevel, spriteForLevel(shareLevel)));

async function loadCharacter() {
  try {
    const res = await fetch(`/api/character?reporter_id=${reporterId}`);
    const j = await res.json();
    if (j.ok) renderCharacter(j);
  } catch { /* キャラ表示だけなので失敗しても致命的ではない */ }
}

// セッション内でスキップした通報ID(直近20件まで)。次の候補取得で除外する。
const skippedIds = [];

async function loadNext() {
  $('triage-card').hidden = true;
  $('triage-status').textContent = '写真を探しています...';
  const params = new URLSearchParams({ voter_id: reporterId });
  if (skippedIds.length) params.set('exclude', skippedIds.slice(-20).join(','));
  try {
    const res = await fetch(`/api/triage/next?${params}`);
    const j = await res.json();
    if (!j.ok) { $('triage-status').textContent = j.error || '読み込みに失敗しました'; return; }
    if (!j.report) {
      $('triage-status').textContent = '今は判定待ちの写真がありません。また後で来てください!';
      return;
    }
    $('triage-status').textContent = '';
    $('triage-img').src = j.report.thumb_url;
    $('triage-card').dataset.reportId = j.report.report_id;
    $('triage-card').hidden = false;
  } catch {
    $('triage-status').textContent = '読み込みに失敗しました';
  }
}

// サムネイルが読めない場合(対象がレビュー等で状態変化した等のTOCTOU)は自動で次へ。
$('triage-img').addEventListener('error', () => { loadNext(); });

function showXpToast(amount) {
  const el = $('xp-toast');
  el.textContent = `+${amount} XP`;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(() => { el.classList.remove('show'); }, 1000);
}

document.querySelectorAll('.triage-buttons button[data-choice]').forEach((btn) => {
  btn.addEventListener('click', async () => {
    const reportId = $('triage-card').dataset.reportId;
    if (!reportId) return;
    document.querySelectorAll('.triage-buttons button').forEach((b) => { b.disabled = true; });

    const choice = btn.dataset.choice;
    if (choice === 'skip') {
      skippedIds.push(reportId);
    } else {
      try {
        await authReady;
        const res = await fetch('/api/triage/vote', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ report_id: reportId, voter_id: reporterId, choice }),
        });
        const j = await res.json();
        if (j.ok && j.awarded) {
          showXpToast(2);
          vibrate(20);
          const prevLevel = lastLevel;
          renderCharacter(j);
          if (j.leveled_up) showLevelUp(prevLevel, j.level);
        }
      } catch { /* 失敗しても次の写真へは進む(ゲームの流れを止めない) */ }
    }

    await loadNext();
    document.querySelectorAll('.triage-buttons button').forEach((b) => { b.disabled = false; });
  });
});

$('start-btn').addEventListener('click', () => {
  $('action-wrap').hidden = true;
  $('triage-area').hidden = false;
  loadNext();
});
$('triage-close').addEventListener('click', () => {
  $('triage-area').hidden = true;
  $('action-wrap').hidden = false;
});

authReady.then(() => {
  $('login-link').href = googleLoginUrl(reporterId);
  loadCharacter();
});
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIUC: Today is under construction.</title>
<link rel="stylesheet" href="tokens.css">
<style>
  :root { --line:#ddd; --muted:#666; --warn:#a33; --ok:#161; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: system-ui, -apple-system, sans-serif; color: #222;
         display: flex; flex-direction: column; }

  #topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px;
            border-bottom: 1px solid var(--line); flex: none; }
  #topbar h1 { font-size: 15px; margin: 0; flex: 1; }
  #topbar h1 .tagline { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
  #login-link { font-size: 12px; color: #1a4d73; text-decoration: none; flex: none; }

  #hero { flex: none; padding: 28px 16px 20px; text-align: center;
          background: linear-gradient(180deg, #eef5f0, #fff); }
  #hero .headline { font-size: 15px; color: #222; margin: 0 0 14px; line-height: 1.5; }
  #stats-row { display: flex; justify-content: center; gap: 18px; }
  #stats-row .stat { text-align: center; }
  #stats-row .n { font-size: 20px; font-weight: 700; color: var(--color-accent, #1a5c3a); }
  #stats-row .label { font-size: 11px; color: var(--muted); }

  #modes { flex: none; padding: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mode-card { display: flex; flex-direction: column; align-items: center; justify-content: center;
               gap: 6px; padding: 16px 6px; min-height: 88px; border-radius: var(--radius-card, 16px);
               text-decoration: none; color: inherit; border: 1px solid var(--line); text-align: center; }
  .mode-card .icon { font-size: 28px; line-height: 1; }
  .mode-card .title { font-size: 12px; font-weight: 700; line-height: 1.3; }
  .mode-card.primary { background: var(--color-accent, #1a5c3a); color: #fff; border-color: var(--color-accent, #1a5c3a); }
  .mode-card.secondary { background: var(--color-secondary, #1a4d73); color: #fff; border-color: var(--color-secondary, #1a4d73); }
  .mode-card.tertiary { background: #fff; }
  .mode-card.tertiary:active { background: #f4f4f2; }

  #my-points { flex: none; margin: 0 16px 16px; padding: 12px 16px; border: 1px solid var(--line);
               border-radius: var(--radius-card, 16px); display: flex; align-items: center;
               justify-content: space-between; text-decoration: none; color: inherit; }
  #my-points .label { font-size: 12px; color: var(--muted); }
  #my-points .value { font-size: 16px; font-weight: 700; }

  footer { flex: 1; display: flex; align-items: flex-end; padding: 12px 16px; }
  footer .note { font-size: 11px; color: var(--muted); margin: 0; text-align: center; width: 100%; }
</style>
<body>

<div id="topbar">
  <h1>TIUC<span class="tagline">Today is under construction.</span></h1>
  <a id="login-link" href="#">ログイン</a>
</div>

<section id="hero">
  <p class="headline">街のヘンな外国語表記、<br>みんなで見つけて、なおそう。</p>
  <div id="stats-row">
    <div class="stat"><div class="n" id="stat-posts">—</div><div class="label">投稿</div></div>
    <div class="stat"><div class="n" id="stat-fixed">—</div><div class="label">確定した修正</div></div>
  </div>
</section>

<div id="modes">
  <a href="report.html" class="mode-card primary">
    <span class="icon">📷</span>
    <span class="title">撮影投稿</span>
  </a>
  <a href="menu.html" class="mode-card secondary">
    <span class="icon">🔍</span>
    <span class="title">キュレーション</span>
  </a>
  <a href="map.html" class="mode-card tertiary">
    <span class="icon">🗺️</span>
    <span class="title">マップで見る</span>
  </a>
</div>

<a href="mypage.html" id="my-points">
  <span class="label">あなたのポイント</span>
  <span class="value" id="my-points-value">— pt</span>
</a>

<footer>
  <p class="note">ログイン不要・匿名で利用できます。写真は判定・修正の関係者のみが閲覧できます。</p>
</footer>

<script type="module">
import { getUserId, bootstrapAuth, googleLoginUrl } from './auth.js';

const $ = (id) => document.getElementById(id);
let userId = getUserId();
const authReady = bootstrapAuth().then((r) => {
  userId = r.userId;
  if (r.session) {
    $('login-link').textContent = r.session.display_name || 'ログイン中';
    $('login-link').href = 'mypage.html';
  } else {
    $('login-link').href = googleLoginUrl(userId);
  }
});

fetch('/api/health').then((r) => r.json()).then((j) => {
  if (!j.ok) return;
  $('stat-posts').textContent = j.total;
  $('stat-fixed').textContent = j.confirmed ?? 0;
}).catch(() => {});

authReady.then(() => {
  fetch(`/api/mypage?user_id=${userId}`).then((r) => r.json()).then((j) => {
    if (j.ok) $('my-points-value').textContent = `${j.summary.points_total} pt / Lv.${j.summary.level}`;
  }).catch(() => {});
});
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>通報レビュー</title>
<style>
  :root { --line:#ddd; --muted:#666; --warn:#a33; --ok:#161; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0 auto; padding: 16px;
         max-width: 620px; line-height: 1.6; color: #222; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  input, select, textarea, button { font-family: inherit; font-size: 15px; }
  input[type=text], input[type=password], select, textarea {
    width: 100%; padding: 9px; border: 1px solid var(--line); border-radius: 8px; }
  .bar { display: flex; justify-content: space-between; align-items: center;
         font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .card.flag { border-color: #d9a; background: #fffaf9; }
  .head { display: flex; gap: 12px; }
  .head img { width: 130px; height: 130px; object-fit: cover; border-radius: 8px;
              background: #eee; flex: none; cursor: zoom-in; }
  .meta { font-size: 12px; flex: 1; }
  .meta div { margin-bottom: 2px; }
  .k { color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
         border: 1px solid var(--line); margin-right: 4px; }
  .tag.alert { border-color: #c66; color: var(--warn); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .fields label { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button { flex: 1; padding: 11px; border-radius: 8px; border: 1px solid var(--line);
                    background: #fff; cursor: pointer; }
  .actions .yes { background: #1a5c3a; color: #fff; border-color: #1a5c3a; }
  .actions .no  { background: #8a2b2b; color: #fff; border-color: #8a2b2b; }
  .msg { font-size: 13px; margin-top: 8px; }
  #login { max-width: 320px; }
  #login > * { margin-bottom: 10px; }
  .full { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none;
          align-items: center; justify-content: center; z-index: 10; }
  .full img { max-width: 96%; max-height: 96%; }
</style>
<body>

<div id="login" hidden>
  <h1>レビュー画面</h1>
  <input id="name" type="text" placeholder="お名前(記録に残ります)" autocomplete="name">
  <input id="pw" type="password" placeholder="パスワード" autocomplete="current-password">
  <button id="dologin" style="width:100%;padding:12px;border:0;border-radius:8px;background:#333;color:#fff">ログイン</button>
  <p class="msg" id="login-msg"></p>
</div>

<div id="app" hidden>
  <div class="bar">
    <span id="who"></span>
    <span><span id="count"></span> 件待ち &nbsp;<a href="#" id="logout">ログアウト</a></span>
  </div>
  <div id="list"></div>
  <p class="msg" id="list-msg"></p>
</div>

<div class="full" id="lightbox"><img alt=""></div>

<script type="module">
const $ = (id) => document.getElementById(id);

const FINDING = { frass:'フラス', adult_alive:'成虫(生)', adult_dead:'成虫(死)',
                  exit_hole:'脱出孔', none:'異常なし' };
const SPECIES = { sakura:'サクラ', ume:'ウメ', momo:'モモ', sumomo:'スモモ',
                  other_rosaceae:'その他バラ科', non_rosaceae:'バラ科以外', unknown:'不明' };

const jst = (t) => t ? new Date(t * 1000).toLocaleString('ja-JP',
  { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';

// --- ログイン ---------------------------------------------------------
$('dologin').onclick = async () => {
  $('login-msg').textContent = '';
  const res = await fetch('/api/review/login', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ name: $('name').value, password: $('pw').value }),
  });
  const j = await res.json();
  if (!j.ok) { $('login-msg').innerHTML = `<span style="color:#a33">${j.error}</span>`; return; }
  start();
};

$('logout').onclick = async (e) => {
  e.preventDefault();
  await fetch('/api/review/logout');
  location.reload();
};

async function start() {
  const res = await fetch('/api/review/queue');
  if (res.status === 401) { $('login').hidden = false; $('app').hidden = true; return; }
  const j = await res.json();
  $('login').hidden = true;
  $('app').hidden = false;
  $('who').textContent = j.reviewer;
  $('count').textContent = j.pending;
  render(j.items);
}

// --- 一覧 -------------------------------------------------------------
function render(items) {
  if (!items.length) {
    $('list').innerHTML = '';
    $('list-msg').textContent = '待機中の通報はありません。';
    return;
  }
  $('list-msg').textContent = '';
  $('list').innerHTML = items.map(cardHtml).join('');
  bind();
}

function cardHtml(r) {
  const flags = [];
  if (r.loc_conflict) flags.push('<span class="tag alert">位置が不一致</span>');
  if (r.nearby > 0) flags.push(`<span class="tag alert">近隣に${r.nearby}件</span>`);
  if (r.trust_score < 0.4) flags.push('<span class="tag alert">信頼度低</span>');
  if (r.finding === 'adult_alive') flags.push('<span class="tag alert">生きた成虫</span>');
  // AIは無関係と判定したが、通報者本人が「このまま送信する」で上書きした通報。
  // (status が auto_rejected のままなら reviewQueue に出てこないので、この条件は
  //  「上書き済みで審査中」のケースだけを指す)
  if (r.ai_verdict === 'reject') flags.push('<span class="tag alert">AI却下→本人が送信</span>');

  // AI一次判定の情報バッジ(alertではない。card.flagのトグルには影響させない)。
  // provisional は既にAI通過で地図に暫定表示中のため、レビュアーに優先度の目安を伝える。
  const badges = [];
  if (r.status === 'provisional') badges.push('<span class="tag">地図に公開中</span>');
  if (r.ai_verdict === 'pass') badges.push('<span class="tag">AI:通過</span>');
  // キャラ育成ゲームの匿名クラウド投票。位置情報等は投票者に見せていないので、
  // ここでも人数の集計のみ表示する(個々の投票内容は出さない)。
  if (r.crowd_total > 0) badges.push(`<span class="tag">クラウド ${r.crowd_pass}/${r.crowd_total}</span>`);

  return `
  <div class="card ${flags.length ? 'flag' : ''}" data-id="${r.id}">
    <div class="head">
      <img src="/img/${r.thumb_key}" data-full="/img/${r.image_key}" alt="">
      <div class="meta">
        <div><strong>${FINDING[r.finding] || r.finding}</strong> / ${SPECIES[r.tree_species] || '—'}</div>
        <div class="k">通報 ${jst(r.created_at)}${r.observed_at ? ` / 撮影 ${jst(r.observed_at)}` : ''}</div>
        <div class="k">${r.mesh4} &nbsp; ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</div>
        <div class="k">${r.loc_source === 'exif' ? '写真の記録' : '端末の現在地'}
          ${r.loc_accuracy_m ? ` / 誤差約${Math.round(r.loc_accuracy_m)}m` : ''}</div>
        <div class="k">通報者 確定${r.confirmed_count}/否定${r.rejected_count}
          (信頼度 ${r.trust_score.toFixed(2)})</div>
        ${r.note ? `<div style="margin-top:4px">${escapeHtml(r.note)}</div>` : ''}
        <div style="margin-top:6px">${[...flags, ...badges].join('')}</div>
      </div>
    </div>

    <div class="fields">
      <div>
        <label>土地の種別</label>
        <select class="land">
          <option value="">選択してください</option>
          <option value="public">公有地(街路樹・公園など)</option>
          <option value="private">私有地</option>
          <option value="unknown">不明</option>
        </select>
      </div>
      <div>
        <label>対応状況</label>
        <select class="resp">
          <option value="">未着手</option>
          <option value="scheduled">対応予定</option>
          <option value="treating">対応中</option>
          <option value="done">対応済み</option>
        </select>
      </div>
    </div>

    <div style="margin-top:8px">
      <label style="font-size:12px;color:#666">住民へのお知らせ(公開されます・任意)</label>
      <textarea class="rnote" rows="2" maxlength="300"
        placeholder="例:このエリアは8月上旬に防除を実施予定です"></textarea>
    </div>

    <div class="actions">
      <button class="yes" data-d="confirmed">被害あり</button>
      <button class="no"  data-d="rejected">該当なし</button>
      <button data-d="duplicate">重複</button>
    </div>
    <p class="msg result"></p>
  </div>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

// --- 操作 -------------------------------------------------------------
function bind() {
  document.querySelectorAll('.head img').forEach((img) => {
    img.onclick = () => {
      const lb = $('lightbox');
      lb.querySelector('img').src = img.dataset.full;
      lb.style.display = 'flex';
    };
  });
  $('lightbox').onclick = () => { $('lightbox').style.display = 'none'; };

  document.querySelectorAll('.actions button').forEach((btn) => {
    btn.onclick = async () => {
      const card = btn.closest('.card');
      const land = card.querySelector('.land').value;

      if (btn.dataset.d === 'confirmed' && !land) {
        card.querySelector('.result').innerHTML =
          '<span style="color:#a33">土地の種別を選んでください(地図の表示範囲が変わります)</span>';
        return;
      }

      card.querySelectorAll('button').forEach((b) => (b.disabled = true));
      const res = await fetch('/api/review/decide', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          report_id: card.dataset.id,
          decision: btn.dataset.d,
          land_type: land || null,
          response_status: card.querySelector('.resp').value || null,
          response_note: card.querySelector('.rnote').value || null,
        }),
      });
      const j = await res.json();
      if (!j.ok) {
        card.querySelector('.result').innerHTML = `<span style="color:#a33">${j.error}</span>`;
        card.querySelectorAll('button').forEach((b) => (b.disabled = false));
        return;
      }
      card.style.opacity = .45;
      card.querySelector('.result').innerHTML =
        `<span style="color:#161">登録しました(通報者に ${j.bonus} ポイント)</span>`;
      $('count').textContent = Math.max(0, Number($('count').textContent) - 1);
    };
  });
}

start();
</script>
</body>
</html>

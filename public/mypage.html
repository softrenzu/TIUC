<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>マイページ - TIUC</title>
<link rel="stylesheet" href="tokens.css">
<style>
  :root { --line:#ddd; --muted:#666; --warn:#a33; --ok:#161; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0 auto; padding: 16px;
         max-width: 520px; line-height: 1.6; color: #222; }

  #topbar { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; }
  #topbar a { font-size: 12px; color: var(--muted); text-decoration: none; }

  h1 { font-size: 19px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 24px 0 8px; }
  .lead { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { border: 1px solid var(--line); border-radius: var(--radius-card, 10px); padding: 12px; text-align: center; }
  .stat .n { font-size: 22px; font-weight: 600; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card { border: 1px solid var(--line); border-radius: var(--radius-card, 10px); padding: 10px 12px; margin-bottom: 8px; }
  .card .row1 { display: flex; justify-content: space-between; align-items: center; font-size: 13px; gap: 8px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
           border: 1px solid var(--line); white-space: nowrap; }
  .badge.pending_judgment { border-color: var(--color-secondary, #1a4d73); color: var(--color-secondary, #1a4d73); }
  .badge.needs_fix        { border-color: var(--warn); color: var(--warn); }
  .badge.looks_ok         { border-color: var(--muted); color: var(--muted); }
  .badge.confirmed        { border-color: var(--ok); color: var(--ok); }
  .badge.adopted          { border-color: var(--ok); color: #fff; background: var(--ok); }
  .memo { font-size: 12px; margin-top: 6px; color: var(--muted); }
  .ledger-row { display: flex; justify-content: space-between; align-items: baseline;
                font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); gap: 8px; }
  .ledger-row:last-child { border-bottom: 0; }
  .delta { font-weight: 600; flex: none; color: var(--ok); }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  .empty-cta { text-align: center; border: 1px dashed var(--line); border-radius: var(--radius-card, 10px);
               padding: 22px 16px; }
  .empty-cta .icon { font-size: 30px; }
  .empty-cta p { font-size: 13px; color: var(--muted); margin: 8px 0 14px; }
  .empty-cta a { display: inline-block; padding: 10px 18px; border-radius: var(--radius-pill);
                 background: var(--color-accent, #1a5c3a); color: #fff; text-decoration: none; font-size: 14px; }
  .status { font-size: 13px; color: var(--muted); }
  .warn { color: var(--warn); }
  .mono { font-family: ui-monospace, monospace; }

  #posts .card { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex;
                     align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal-backdrop[hidden] { display: none; }
  .modal-card { background: #fff; border-radius: 12px; max-width: 420px; width: 100%;
                max-height: 90vh; overflow-y: auto; position: relative; padding: 16px; }
  .modal-close { position: absolute; top: 8px; right: 8px; border: none; background: none;
                 font-size: 22px; cursor: pointer; color: #666; line-height: 1; padding: 4px; }
  .modal-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #eee;
                     border-radius: 8px; margin-bottom: 12px; display: block; }
  .detail-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0;
                border-bottom: 1px solid var(--line); gap: 12px; }
  .detail-row:last-child { border-bottom: 0; }
  .detail-row span:first-child { color: var(--muted); flex: none; }
  .detail-actions { display: flex; gap: 8px; margin-top: 14px; }
  .detail-actions button { flex: 1; padding: 9px; font-size: 13px; border: 1px solid var(--line);
                            border-radius: 8px; background: #fff; cursor: pointer; }
  .detail-actions button.danger { color: var(--warn); border-color: var(--warn); }
  .detail-msg { font-size: 12px; margin-top: 8px; min-height: 1.2em; }
</style>
<body>

<div id="topbar">
  <a href="/">← トップ</a>
  <a id="login-link" href="#">ログイン</a>
</div>
<h1>マイページ</h1>
<p class="lead">これまでの貢献とポイントです。</p>

<div class="stats" id="stats"></div>

<h2>投稿履歴</h2>
<div id="posts"></div>

<h2>ポイント履歴</h2>
<div id="ledger"></div>

<p class="status" id="page-status"></p>

<div id="detail-modal" class="modal-backdrop" hidden>
  <div class="modal-card">
    <button type="button" id="detail-close" class="modal-close" aria-label="閉じる">×</button>
    <img id="detail-img" alt="投稿時の写真">
    <div id="detail-body"></div>
  </div>
</div>

<script type="module">
import { getUserId, bootstrapAuth, googleLoginUrl } from './auth.js';

const $ = (id) => document.getElementById(id);
let userId = getUserId();
let posts = [];

const STATUS_LABEL = {
  pending_judgment: '判定待ち', needs_fix: '修正待ち', looks_ok: '問題なし(確認済み)',
  confirmed: '修正確定', adopted: '店が採用',
};
const LANG_LABEL = { 'ja-en': '日→英', 'ja-zh': '日→中', 'ja-ko': '日→韓' };
const jst = (t) => t ? new Date(t * 1000).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }) : '—';

const POINT_LABEL = {
  post_submit: '投稿', judgment: '違和感チェック', correction_propose: '修正提案',
  correction_confirm_bonus: '修正案が確定', vote: '投票', adopt_bonus: '店に採用', revoke: '取り消し', manual: '運営調整',
};

async function load() {
  $('page-status').textContent = '読み込み中...';
  const r = await bootstrapAuth();
  userId = r.userId;
  if (r.session) {
    $('login-link').textContent = r.session.display_name || 'ログイン中';
    $('login-link').removeAttribute('href');
  } else {
    $('login-link').href = googleLoginUrl(userId);
  }

  try {
    const res = await fetch(`/api/mypage?user_id=${userId}`);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || '取得に失敗しました');
    $('page-status').textContent = '';
    renderStats(j.summary);
    renderPosts(j.posts);
    renderLedger(j.point_events);
  } catch (e) {
    $('page-status').innerHTML = `<span class="warn">${e.message}</span>`;
  }
}

function renderStats(s) {
  $('stats').innerHTML = `
    <div class="stat"><div class="n">${s.points_total}</div><div class="label">ポイント (Lv.${s.level})</div></div>
    <div class="stat"><div class="n">${s.post_count}</div><div class="label">投稿</div></div>
    <div class="stat"><div class="n">${s.judged_count}</div><div class="label">違和感チェック</div></div>
    <div class="stat"><div class="n">${s.corrected_count}</div><div class="label">修正提案</div></div>`;
}

function renderPosts(list) {
  posts = list;
  const el = $('posts');
  if (!list.length) {
    el.innerHTML = `<div class="empty-cta">
      <p class="icon">📷</p>
      <p>まだ投稿がありません。街で見かけた外国語表記を撮ってみましょう。</p>
      <a href="report.html">投稿する</a>
    </div>`;
    return;
  }
  el.innerHTML = list.map((p) => `
    <div class="card" data-id="${p.id}">
      <div class="row1">
        <span>${LANG_LABEL[p.lang_pair] || p.lang_pair} ・ ${jst(p.created_at)}</span>
        <span class="badge ${p.status}">${STATUS_LABEL[p.status] || p.status}</span>
      </div>
      ${p.situation ? `<p class="memo">${escapeHtml(p.situation)}</p>` : ''}
    </div>
  `).join('');
  el.querySelectorAll('.card').forEach((card) => {
    card.addEventListener('click', () => openDetail(card.dataset.id));
  });
}

function renderLedger(events) {
  const el = $('ledger');
  if (!events.length) { el.innerHTML = '<p class="empty">まだ履歴がありません。</p>'; return; }
  el.innerHTML = events.map((e) => `
    <div class="ledger-row">
      <span>${POINT_LABEL[e.kind] || e.kind} ・ ${jst(e.created_at)}</span>
      <span class="delta">+${e.points}</span>
    </div>
  `).join('');
}

function openDetail(id) {
  const p = posts.find((x) => x.id === id);
  if (!p) return;
  $('detail-img').src = `/img/${p.src_thumb_key}?user_id=${encodeURIComponent(userId)}`;
  $('detail-body').innerHTML = `
    <div class="detail-row"><span>言語</span><span>${LANG_LABEL[p.lang_pair] || p.lang_pair}</span></div>
    <div class="detail-row"><span>状態</span><span>${STATUS_LABEL[p.status] || p.status}</span></div>
    <div class="detail-row"><span>原文</span><span>${escapeHtml(p.original_text || '—')}</span></div>
    <div class="detail-row"><span>訳文</span><span>${escapeHtml(p.translated_text || '—')}</span></div>
    <div class="detail-row"><span>投稿日</span><span>${jst(p.created_at)}</span></div>
    ${p.situation ? `<div class="detail-row"><span>メモ</span><span>${escapeHtml(p.situation)}</span></div>` : ''}
    ${p.status === 'pending_judgment' ? `
      <div class="detail-actions">
        <button type="button" class="danger" id="detail-delete">削除する</button>
      </div>
      <p class="detail-msg" id="detail-msg"></p>
    ` : ''}
  `;
  $('detail-modal').hidden = false;

  const delBtn = document.getElementById('detail-delete');
  if (delBtn) {
    delBtn.addEventListener('click', async () => {
      delBtn.disabled = true;
      const msg = document.getElementById('detail-msg');
      msg.textContent = '削除中...';
      try {
        const res = await fetch('/api/posts/delete', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ user_id: userId, post_id: p.id }),
        });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error);
        $('detail-modal').hidden = true;
        load();
      } catch (e) {
        msg.innerHTML = `<span class="warn">${e.message}</span>`;
        delBtn.disabled = false;
      }
    });
  }
}

$('detail-close').addEventListener('click', () => { $('detail-modal').hidden = true; });
$('detail-modal').addEventListener('click', (e) => { if (e.target === $('detail-modal')) $('detail-modal').hidden = true; });

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

load();
</script>
</body>
</html>

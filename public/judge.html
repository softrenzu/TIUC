<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>違和感チェック - TIUC</title>
<link rel="stylesheet" href="tokens.css">
<style>
  :root { --line:#ddd; --muted:#666; --warn:#a33; --ok:#161; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0 auto; padding: 16px;
         max-width: 480px; line-height: 1.6; color: #222; }
  #topbar { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; }
  #topbar a { font-size: 12px; color: var(--muted); text-decoration: none; }
  #points-badge { font-size: 12px; border: 1px solid var(--line); border-radius: var(--radius-pill);
                  padding: 3px 10px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .lead { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

  #lang-select { display: flex; gap: 8px; margin-bottom: 16px; }
  #lang-select button { flex: 1; padding: 10px; font-size: 13px; border: 1px solid var(--line);
                         border-radius: var(--radius-sm); background: #fff; cursor: pointer; }
  #lang-select button.active { background: var(--color-accent, #1a5c3a); color: #fff; border-color: var(--color-accent, #1a5c3a); }

  #card { border: 1px solid var(--line); border-radius: var(--radius-card, 16px); padding: 16px; }
  #card[hidden] { display: none; }
  .imgs { display: flex; gap: 8px; }
  .imgs > div { flex: 1; }
  .imgs img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; background: #eee; display: block; }
  .imgs .cap { font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin: 10px 0; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .btns button { padding: 18px 8px; font-size: 15px; font-weight: 600; border-radius: var(--radius-card, 12px);
                 border: 2px solid var(--line); background: #fff; cursor: pointer; }
  .btns button.natural { border-color: var(--ok); color: var(--ok); }
  .btns button.unnatural { border-color: var(--warn); color: var(--warn); }
  .btns button:disabled { opacity: .5; cursor: default; }
  #skip { display: block; width: 100%; margin-top: 10px; padding: 8px; font-size: 12px;
          color: var(--muted); background: none; border: none; cursor: pointer; text-decoration: underline; }

  #empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  #empty .icon { font-size: 40px; }
  .status { font-size: 13px; color: var(--muted); margin-top: 10px; text-align: center; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: #222; color: #fff; padding: 10px 20px; border-radius: 999px;
           font-size: 13px; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
<body>

<div id="topbar">
  <a href="menu.html">← キュレーション</a>
  <div id="points-badge">0 pt</div>
</div>
<h1>🔍 違和感チェック</h1>
<p class="lead">訳文を見て、自然かどうかを一タップで判定してください。母語話者向けです。</p>

<div id="lang-select">
  <button type="button" data-lang="ja-en" class="active">→英語</button>
  <button type="button" data-lang="ja-zh">→中国語</button>
  <button type="button" data-lang="ja-ko">→韓国語</button>
</div>

<div id="card" hidden>
  <div class="imgs" id="imgs"></div>
  <p class="meta" id="meta"></p>
  <div class="btns">
    <button type="button" class="unnatural" id="btn-unnatural">😕 不自然</button>
    <button type="button" class="natural" id="btn-natural">🙂 自然</button>
  </div>
  <button type="button" id="skip">スキップして次へ</button>
</div>

<div id="empty" hidden>
  <p class="icon">🎉</p>
  <p>今この言語ペアで判定できる投稿はありません。<br>ほかの言語ペアを試すか、また後で来てください。</p>
</div>

<p class="status" id="status"></p>
<div class="toast" id="toast"></div>

<script type="module">
import { getUserId, bootstrapAuth } from './auth.js';

let userId = getUserId();
const authReady = bootstrapAuth().then((r) => { userId = r.userId; });
const $ = (id) => document.getElementById(id);

let langPair = 'ja-en';
let current = null;
const seen = [];

async function loadPointsBadge() {
  try {
    const res = await fetch(`/api/mypage?user_id=${userId}`);
    const j = await res.json();
    if (j.ok) $('points-badge').textContent = `${j.summary.points_total} pt / Lv.${j.summary.level}`;
  } catch { /* バッジのみ */ }
}

function showToast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1200);
}

document.querySelectorAll('#lang-select button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#lang-select button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    langPair = btn.dataset.lang;
    seen.length = 0;
    loadNext();
  });
});

async function loadNext() {
  $('status').textContent = '読み込み中...';
  $('card').hidden = true;
  $('empty').hidden = true;
  await authReady;
  try {
    const params = new URLSearchParams({ user_id: userId, lang_pair: langPair, exclude: seen.slice(-20).join(',') });
    const res = await fetch(`/api/judge/next?${params}`);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || '取得に失敗しました');
    $('status').textContent = '';
    if (!j.post) { $('empty').hidden = false; current = null; return; }
    current = j.post;
    $('imgs').innerHTML =
      `<div><img src="${current.src_thumb_url}" alt="原文"><p class="cap">原文</p></div>` +
      (current.tgt_thumb_url ? `<div><img src="${current.tgt_thumb_url}" alt="訳文"><p class="cap">訳文</p></div>` : '');
    $('meta').textContent = current.situation ? `メモ: ${current.situation}` : '';
    $('card').hidden = false;
  } catch (e) {
    $('status').textContent = e.message;
  }
}

async function submit(verdict) {
  if (!current) return;
  document.querySelectorAll('.btns button').forEach((b) => b.disabled = true);
  try {
    const res = await fetch('/api/judge/submit', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ user_id: userId, post_id: current.post_id, verdict }),
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    showToast(`+${j.points}pt` + (j.transitioned_to ? ' ・配車しました' : ''));
    loadPointsBadge();
    seen.push(current.post_id);
    loadNext();
  } catch (e) {
    $('status').textContent = e.message;
  } finally {
    document.querySelectorAll('.btns button').forEach((b) => b.disabled = false);
  }
}

$('btn-natural').addEventListener('click', () => submit('natural'));
$('btn-unnatural').addEventListener('click', () => submit('unnatural'));
$('skip').addEventListener('click', () => {
  if (current) seen.push(current.post_id);
  loadNext();
});

authReady.then(() => { loadPointsBadge(); loadNext(); });
</script>
</body>
</html>

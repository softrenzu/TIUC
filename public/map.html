<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>クビアカツヤカミキリ 被害マップ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; color: #222; }
  #map { position: absolute; left: 0; right: 0; bottom: 0; top: 88px; }

  /* 凡例・詳細フィルタは折りたたみだが、エリア検索は常時入力できる状態を維持する
     (スマホの狭い画面で地図に被って見づらいという問題への対応)。 */
  #topbar { position: absolute; z-index: 2; top: 0; left: 0; right: 0;
            background: #fff; border-bottom: 1px solid #ddd; box-shadow: 0 1px 4px rgba(0,0,0,.08);
            display: flex; flex-direction: column; gap: 8px; padding: 8px 10px; }
  #topbar-row1 { display: flex; align-items: center; gap: 6px; height: 28px; }
  #topbar-row2 { display: flex; align-items: center; gap: 6px; height: 36px; }
  #topbar .back { font-size: 12px; color: #666; white-space: nowrap; text-decoration: none; flex: none; }
  #topbar h1 { font-size: 14px; margin: 0; flex: 1; min-width: 0; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  #status-msg { font-size: 11px; color: #666; white-space: nowrap; flex: none; }
  .icon-btn { flex: none; display: flex; align-items: center; gap: 4px; font-size: 12px;
              background: #f5f5f4; border: 1px solid #ddd; border-radius: 8px;
              padding: 0 10px; height: 34px; cursor: pointer; color: #222; }
  .icon-btn.active { background: #2a2a28; color: #fff; border-color: #2a2a28; }
  .icon-btn .glyph { font-size: 14px; line-height: 1; }

  #place-row { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; height: 100%; }
  #place-row input[type=text] { flex: 1 1 auto; min-width: 40px; font-size: 13px; padding: 0 8px;
                                 border: 1px solid #ddd; border-radius: 8px; }
  #place-row button { flex: none; font-size: 12px; padding: 0 10px; border: 1px solid #ddd;
                       border-radius: 8px; background: #f5f5f4; cursor: pointer; }
  #place-msg { position: absolute; z-index: 1; top: 88px; left: 10px; right: 10px; margin: 0;
               font-size: 11px; color: #a33; background: #fff; border-radius: 0 0 8px 8px;
               padding: 4px 6px; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
  #place-msg:empty { display: none; }

  .dropdown { position: absolute; z-index: 1; top: 88px; right: 10px;
              width: min(300px, calc(100vw - 20px)); max-height: calc(100vh - 116px); overflow-y: auto;
              background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 14px;
              font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; }
  .dropdown.open { display: block; }
  .dropdown h2 { font-size: 12px; color: #666; margin: 14px 0 6px; font-weight: 500; }
  .dropdown h2:first-child { margin-top: 0; }

  #search .row { margin-bottom: 10px; }
  #search label.date { display: block; color: #666; margin-bottom: 2px; }
  #search input[type=date] { width: 100%; font-size: 13px; padding: 5px; border: 1px solid #ddd;
                              border-radius: 6px; }
  #search .resp label { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }

  #legend .swatches { display: flex; flex-direction: column; gap: 3px; margin-bottom: 4px; }
  #legend .sw { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  #legend .sw i.box { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  #legend .sw i.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block;
                       border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }

  .maplibregl-popup-content { font-size: 13px; padding: 10px 12px; }
  .maplibregl-popup-content table { border-collapse: collapse; }
  .maplibregl-popup-content td { padding: 2px 6px 2px 0; vertical-align: top; }
  .maplibregl-popup-content td:first-child { color: #666; white-space: nowrap; }
  .popup-actions { display: flex; gap: 6px; margin-top: 8px; }
  .popup-actions button { flex: 1; font-size: 12px; padding: 6px; border: 1px solid #ddd;
                           border-radius: 6px; background: #fff; cursor: pointer; }
  .popup-actions button:disabled { color: #999; cursor: default; }
  .react-msg { font-size: 11px; color: #a33; margin: 4px 0 0; }
</style>
<body>

<div id="map"></div>

<div id="topbar">
  <div id="topbar-row1">
    <a class="back" href="/">← トップ</a>
    <h1>クビアカツヤカミキリ 被害マップ</h1>
    <span id="status-msg"></span>
  </div>
  <div id="topbar-row2">
    <div id="place-row">
      <input type="text" id="place-q" placeholder="地名・住所で検索(例: 新宿区)">
      <button type="button" id="place-go">検索</button>
    </div>
    <button type="button" id="search-toggle" class="icon-btn"><span class="glyph">⚙️</span>詳細</button>
    <button type="button" id="legend-toggle" class="icon-btn"><span class="glyph">🗂</span>凡例</button>
  </div>
</div>
<p id="place-msg"></p>

<div id="search" class="dropdown">
  <h2>期間</h2>
  <div class="row">
    <label class="date" for="from">はじめ</label>
    <input id="from" type="date">
  </div>
  <div class="row">
    <label class="date" for="to">おわり</label>
    <input id="to" type="date">
  </div>

  <h2>対応状況</h2>
  <div class="row resp">
    <label><input type="checkbox" value="none" checked> 未対応</label>
    <label><input type="checkbox" value="scheduled" checked> 対応予定</label>
    <label><input type="checkbox" value="treating" checked> 対応中</label>
    <label><input type="checkbox" value="done" checked> 対応済み</label>
  </div>
</div>

<div id="legend" class="dropdown">
  <h2>通報件数(メッシュ集計)</h2>
  <div class="swatches" id="mesh-legend"></div>
  <h2>対応状況(公有地・被害確定のみピン表示)</h2>
  <div class="swatches" id="pin-legend"></div>
  <h2>未調査エリアの目安</h2>
  <div class="swatches" id="unsurveyed-legend"></div>
  <p id="unsurveyed-hint" style="margin:4px 0 0;font-size:11px;color:#666" hidden></p>
  <div class="swatches" id="coverage-legend" style="margin-top:6px"></div>
</div>

<script type="module">
import { meshGrid, meshGridCount, meshBounds } from './mesh.js';
import { getReporterId, bootstrapAuth } from './auth.js';

const $ = (id) => document.getElementById(id);

// --- 通報者ID(他ページと同じキーで匿名・端末保存。Googleログイン済みなら
//     端末間で同じIDに揃う) -------------------------------------------
let reporterId = getReporterId();
const authReady = bootstrapAuth().then((r) => { reporterId = r.reporterId; });

// スタンプ済みかどうかをローカルにも記録し、リロード後の見た目上の連打を防ぐ
// (サーバ側は複合主キーで実害なく防げているが、UI 上の混乱を避けるため)。
const REACTED_KEY = 'kubiaka_reacted';
function getReacted() {
  try { return new Set(JSON.parse(localStorage.getItem(REACTED_KEY) || '[]')); }
  catch { return new Set(); }
}
function markReacted(reportId, kind) {
  const s = getReacted();
  s.add(`${reportId}:${kind}`);
  localStorage.setItem(REACTED_KEY, JSON.stringify([...s]));
}

// --- 表示ラベル(review.html と共通の語彙) -----------------------------
const FINDING = { frass: 'フラス', adult_alive: '成虫(生)', adult_dead: '成虫(死)',
                  exit_hole: '脱出孔', none: '異常なし' };
const SPECIES = { sakura: 'サクラ', ume: 'ウメ', momo: 'モモ', sumomo: 'スモモ',
                   other_rosaceae: 'その他バラ科', non_rosaceae: 'バラ科以外', unknown: '不明' };
const RESPONSE_LABEL = { scheduled: '対応予定', treating: '対応中', done: '対応済み' };

const jst = (t) => t ? new Date(t * 1000).toLocaleDateString('ja-JP',
  { timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric' }) : '—';

// APIキー不要のGoogleマップ経路検索URL(公式のURLベースAPI)。
const googleMapsUrl = (lat, lng) =>
  `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

// --- 配色(dataviz スキルで検証した sequential red ランプ / status パレットをそのまま使用) ---
// 青系は視認性が悪いとのフィードバックにより赤系へ変更。5段階・単一色相・明度単調増加を
// scripts/validate_palette.js --ordinal で確認済み(浅い側の2:1コントラストは、0件セルが
// 背景に馴染んで見えるsequentialランプの正常な挙動なのでFAILのままでよい)。
// 件数のしきい値(1/3/6/12)は現状のデータ量に基づく仮置き。実データを見て調整する。
const MESH_STEPS = [
  { max: 0,  color: '#fbdad7', label: '0件' },
  { max: 2,  color: '#f2a9a3', label: '1〜2件' },
  { max: 5,  color: '#e2726a', label: '3〜5件' },
  { max: 11, color: '#c73f36', label: '6〜11件' },
  { max: Infinity, color: '#8f1f1a', label: '12件以上' },
];
const STATUS_COLOR = { none: '#d03b3b', scheduled: '#fab219', treating: '#ec835a', done: '#0ca30c' };
const STATUS_LABEL = { none: '未対応', scheduled: '対応予定', treating: '対応中', done: '対応済み' };

for (const s of MESH_STEPS) {
  $('mesh-legend').insertAdjacentHTML('beforeend',
    `<div class="sw"><i class="box" style="background:${s.color}"></i>${s.label}</div>`);
}
for (const k of ['none', 'scheduled', 'treating', 'done']) {
  $('pin-legend').insertAdjacentHTML('beforeend',
    `<div class="sw"><i class="dot" style="background:${STATUS_COLOR[k]}"></i>${STATUS_LABEL[k]}</div>`);
}

// 未調査(通報0件)の代用指標。survey_mesh(自治体の調査対象データ)は未整備のため、
// 「通報が1件も無いメッシュ」を暫定的に未調査とみなしている。本来の調査対象かどうか
// (山林・水面など対象外エリアも含めて「未調査」表示になる)とは別軸である点に注意。
const UNSURVEYED_COLOR = '#ded9cd';
$('unsurveyed-legend').insertAdjacentHTML('beforeend',
  `<div class="sw"><i class="box" style="background:${UNSURVEYED_COLOR}"></i>通報0件(未調査の目安)</div>`);

// 徒歩スケールの「確認済み」円。公有地・被害確定ピン(=既に正確な座標が公開済み)の
// 周辺だけに描くので、新たな座標の開示にはならない。dataviz スキルのカテゴリカル3番目
// (aqua)を使い、sequential blue(メッシュ集計)/status色(ピン)と衝突しないようにする。
const COVERAGE_COLOR = '#1baf7a';
$('coverage-legend').insertAdjacentHTML('beforeend',
  `<div class="sw"><i class="dot" style="background:${COVERAGE_COLOR}"></i>公有地の確認済みエリア(徒歩の目安・近接時のみ)</div>`);

// --- MapLibre 遅延読込(index.html と同じパターン) ---------------------
let mapLibrePromise = null;
function loadMapLibre() {
  if (mapLibrePromise) return mapLibrePromise;
  mapLibrePromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('地図を読み込めませんでした'));
    document.head.appendChild(s);
  });
  return mapLibrePromise;
}

// ズームに応じてメッシュ集計の粒度を切り替える。実測(1280x720ビューポート)に基づく値。
// zoom < MESH4_MIN_ZOOM: mesh3(1km) / MESH4_MIN_ZOOM〜MESH5_MIN_ZOOM: mesh4(500m) /
// zoom >= MESH5_MIN_ZOOM: mesh5(250m)。
const MESH4_MIN_ZOOM = 11;
const MESH5_MIN_ZOOM = 12;
// この値以上で、公有地・被害確定ピンの周辺に「確認済み」円を重ねる(徒歩スケール)。
const COVERAGE_MIN_ZOOM = 15;

function setStatus(text) {
  $('status-msg').textContent = text || '';
}

// --- 凡例・詳細検索ドロップダウン(排他的に開閉、外側クリックで閉じる) --------------
function closeDropdowns() {
  $('search').classList.remove('open');
  $('legend').classList.remove('open');
  $('search-toggle').classList.remove('active');
  $('legend-toggle').classList.remove('active');
}
function toggleDropdown(panelId, btnId) {
  const opening = !$(panelId).classList.contains('open');
  closeDropdowns();
  if (opening) {
    $(panelId).classList.add('open');
    $(btnId).classList.add('active');
  }
}
$('search-toggle').addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown('search', 'search-toggle'); });
$('legend-toggle').addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown('legend', 'legend-toggle'); });
document.querySelectorAll('.dropdown').forEach((el) => el.addEventListener('click', (e) => e.stopPropagation()));
document.addEventListener('click', closeDropdowns);

async function main() {
  await loadMapLibre();

  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        gsi: {
          type: 'raster',
          // 淡色地図は地味で見づらいというフィードバックにより標準地図に変更(Google Mapsは
          // CLAUDE.mdの方針により不採用。国土地理院タイルの範囲内で見やすさを改善する)。
          tiles: ['https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png'],
          tileSize: 256,
          maxzoom: 18,
          attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" ' +
                       'target="_blank" rel="noopener">地理院タイル</a>',
        },
      },
      layers: [{ id: 'gsi', type: 'raster', source: 'gsi' }],
    },
    center: [139.767, 35.681],
    zoom: 10,
  });
  map.addControl(new maplibregl.NavigationControl(), 'top-right');

  map.on('load', () => {
    map.addSource('kubiaka', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

    map.addLayer({
      id: 'unsurveyed-fill', type: 'fill', source: 'kubiaka',
      filter: ['==', ['get', 'kind'], 'unsurveyed'],
      paint: { 'fill-color': UNSURVEYED_COLOR, 'fill-opacity': 0.45 },
    });
    map.addLayer({
      id: 'unsurveyed-outline', type: 'line', source: 'kubiaka',
      filter: ['==', ['get', 'kind'], 'unsurveyed'],
      paint: { 'line-color': '#8a8478', 'line-opacity': 0.5, 'line-width': 1, 'line-dasharray': [2, 2] },
    });

    map.addLayer({
      id: 'mesh-fill', type: 'fill', source: 'kubiaka',
      filter: ['==', ['get', 'kind'], 'mesh'],
      paint: {
        'fill-color': [
          'step', ['get', 'damage_reports'],
          '#fbdad7',
          1, '#f2a9a3',
          3, '#e2726a',
          6, '#c73f36',
          12, '#8f1f1a',
        ],
        'fill-opacity': 0.6,
      },
    });
    map.addLayer({
      id: 'mesh-outline', type: 'line', source: 'kubiaka',
      filter: ['==', ['get', 'kind'], 'mesh'],
      paint: { 'line-color': '#8f1f1a', 'line-opacity': 0.5, 'line-width': 1 },
    });
    map.addLayer({
      id: 'coverage-circle', type: 'circle', source: 'kubiaka',
      filter: ['==', ['get', 'kind'], 'pin'],
      minzoom: COVERAGE_MIN_ZOOM,
      paint: {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 15, 25, 18, 55],
        'circle-color': COVERAGE_COLOR,
        'circle-opacity': 0.18,
        'circle-stroke-width': 0,
      },
    });
    map.addLayer({
      id: 'pins', type: 'circle', source: 'kubiaka',
      filter: ['==', ['get', 'kind'], 'pin'],
      paint: {
        'circle-radius': 7,
        'circle-color': [
          'match', ['get', 'response_status'],
          'scheduled', STATUS_COLOR.scheduled,
          'treating', STATUS_COLOR.treating,
          'done', STATUS_COLOR.done,
          STATUS_COLOR.none,
        ],
        'circle-stroke-color': '#fff',
        'circle-stroke-width': 1.5,
      },
    });

    map.on('click', 'pins', (e) => {
      const p = e.features[0].properties;
      const respStatus = p.response_status || 'none';
      const reacted = getReacted();
      const seenDone = reacted.has(`${p.id}:seen_too`);
      const thanksDone = reacted.has(`${p.id}:thanks`);

      const popup = new maplibregl.Popup({ closeButton: true, maxWidth: '260px' })
        .setLngLat(e.lngLat)
        .setHTML(`<table>
          <tr><td>発見物</td><td>${FINDING[p.finding] || p.finding}</td></tr>
          <tr><td>樹種</td><td>${SPECIES[p.tree_species] || '—'}</td></tr>
          <tr><td>日付</td><td>${jst(p.event_at)}</td></tr>
          <tr><td>対応状況</td><td>${STATUS_LABEL[respStatus]}</td></tr>
          ${p.response_note ? `<tr><td>お知らせ</td><td>${escapeHtml(p.response_note)}</td></tr>` : ''}
        </table>
        <p style="margin:8px 0 0"><a href="${googleMapsUrl(e.lngLat.lat, e.lngLat.lng)}"
          target="_blank" rel="noopener">ここへ行く(Googleマップ)</a></p>
        <div class="popup-actions">
          <button class="react-btn" data-kind="seen_too" data-id="${p.id}" ${seenDone ? 'disabled' : ''}>
            私も見た (<span class="cnt">${p.seen_too_count}</span>)</button>
          <button class="react-btn" data-kind="thanks" data-id="${p.id}" ${thanksDone ? 'disabled' : ''}>
            ありがとう (<span class="cnt">${p.thanks_count}</span>)</button>
        </div>
        <p class="react-msg"></p>`)
        .addTo(map);

      popup.getElement().querySelectorAll('.react-btn').forEach((btn) => {
        btn.addEventListener('click', () => react(btn));
      });
    });
    map.on('mouseenter', 'pins', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'pins', () => { map.getCanvas().style.cursor = ''; });

    // 未調査セルのクリック → セル中心(メッシュ集計レベルの座標。個別の建物ではない)への
    // ナビリンクを出す。
    map.on('click', 'unsurveyed-fill', (e) => {
      const code = e.features[0].properties.mesh;
      const b = meshBounds(code);
      const centerLat = (b.latMin + b.latMax) / 2;
      const centerLng = (b.lngMin + b.lngMax) / 2;
      new maplibregl.Popup({ closeButton: true, maxWidth: '240px' })
        .setLngLat(e.lngLat)
        .setHTML(`<p style="margin:0">このエリアは通報がありません(未調査の目安)。</p>
          <p style="margin:8px 0 0"><a href="${googleMapsUrl(centerLat, centerLng)}"
            target="_blank" rel="noopener">ここへ行く(Googleマップ)</a></p>`)
        .addTo(map);
    });
    map.on('mouseenter', 'unsurveyed-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'unsurveyed-fill', () => { map.getCanvas().style.cursor = ''; });

    async function react(btn) {
      const kind = btn.dataset.kind;
      const reportId = btn.dataset.id;
      const msgEl = btn.closest('.maplibregl-popup-content').querySelector('.react-msg');
      btn.disabled = true;
      msgEl.textContent = '';
      try {
        await authReady;
        const res = await fetch('/api/reactions', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ reporter_id: reporterId, report_id: reportId, kind }),
        });
        const j = await res.json();
        if (!j.ok) throw new Error(j.error);
        markReacted(reportId, kind);
        const cnt = btn.querySelector('.cnt');
        cnt.textContent = String(Number(cnt.textContent) + 1);
      } catch (e) {
        btn.disabled = false;
        msgEl.textContent = e.message;
      }
    }

    refresh();
  });

  // --- データ取得 -------------------------------------------------------
  function checkedResponses() {
    return [...document.querySelectorAll('#search .resp input:checked')].map((el) => el.value);
  }

  function dateToUnix(value, endOfDay) {
    if (!value) return null;
    const d = new Date(`${value}T${endOfDay ? '23:59:59' : '00:00:00'}+09:00`);
    return Math.floor(d.getTime() / 1000);
  }

  // --- 未調査エリア(通報0件のメッシュ)------------------------------------
  // survey_mesh(自治体の調査対象データ)が未整備のため、bbox 内を現在の粒度(mesh3/4/5)の
  // グリッドで理論上列挙し、/api/map が返した mesh 集計に無いセル(=通報0件)を「未調査」
  // として追加描画する。完全にクライアント側の代用ロジックで、新規 API は使わない。
  // 250m(mesh5)より細かい粒度の存在判定は行わない — CLAUDE.md ルール1が定める
  // 「一般公開は250m/1kmメッシュ集計まで」という下限を超えてしまうため。
  const MESH_GRID_CAP = 8000;

  function addUnsurveyedFeatures(geojson, bounds, level) {
    const minLat = bounds.getSouth(), maxLat = bounds.getNorth();
    const minLng = bounds.getWest(), maxLng = bounds.getEast();

    if (meshGridCount(minLat, minLng, maxLat, maxLng, level) > MESH_GRID_CAP) {
      $('unsurveyed-hint').hidden = false;
      $('unsurveyed-hint').textContent = 'エリアが広すぎるため未調査表示は省略しています。ズームインしてください。';
      return;
    }
    $('unsurveyed-hint').hidden = true;

    const reported = new Set(
      geojson.features.filter((f) => f.properties.kind === 'mesh').map((f) => f.properties.mesh)
    );
    for (const code of meshGrid(minLat, minLng, maxLat, maxLng, level)) {
      if (reported.has(code)) continue;
      const b = meshBounds(code);
      geojson.features.push({
        type: 'Feature',
        properties: { kind: 'unsurveyed', mesh: code },
        geometry: {
          type: 'Polygon',
          coordinates: [[
            [b.lngMin, b.latMin], [b.lngMax, b.latMin],
            [b.lngMax, b.latMax], [b.lngMin, b.latMax],
            [b.lngMin, b.latMin],
          ]],
        },
      });
    }
  }

  let controller = null;
  async function refresh() {
    if (controller) controller.abort();
    controller = new AbortController();

    const b = map.getBounds();
    const zoom = map.getZoom();
    const level = zoom >= MESH5_MIN_ZOOM ? 'mesh5' : (zoom >= MESH4_MIN_ZOOM ? 'mesh4' : 'mesh3');
    const params = new URLSearchParams({
      bbox: [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(','),
      level,
    });
    const from = dateToUnix($('from').value, false);
    const to = dateToUnix($('to').value, true);
    if (from != null) params.set('from', String(from));
    if (to != null) params.set('to', String(to));
    params.set('response', checkedResponses().join(','));

    setStatus('読み込み中…');
    try {
      const res = await fetch(`/api/map?${params}`, { signal: controller.signal });
      const geojson = await res.json();
      if (!res.ok) throw new Error(geojson.error || '取得に失敗しました');
      addUnsurveyedFeatures(geojson, b, level);
      map.getSource('kubiaka').setData(geojson);
      setStatus('');
    } catch (e) {
      if (e.name === 'AbortError') return;
      setStatus(e.message);
    }
  }

  let debounceTimer = null;
  function scheduleRefresh() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(refresh, 300);
  }
  map.on('moveend', scheduleRefresh);
  document.querySelectorAll('#search input[type=date], #search .resp input').forEach((el) => {
    el.addEventListener('change', scheduleRefresh);
  });

  // --- エリア検索(国土地理院 住所検索API。APIキー不要・CORS許可済み) -----------------
  // 通報データではなく地名の座標を引くだけなので、rule1の座標非公開ルールとは無関係。
  async function searchPlace() {
    const q = $('place-q').value.trim();
    const msg = $('place-msg');
    msg.textContent = '';
    if (!q) return;
    msg.textContent = '検索中...';
    try {
      const res = await fetch(`https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(q)}`);
      if (!res.ok) throw new Error('検索に失敗しました');
      const results = await res.json();
      if (!results.length) { msg.textContent = '見つかりませんでした'; return; }
      const [lng, lat] = results[0].geometry.coordinates;
      map.flyTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 14) });
      msg.textContent = '';
    } catch (e) {
      msg.textContent = e.message;
    }
  }
  $('place-go').addEventListener('click', searchPlace);
  $('place-q').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); searchPlace(); }
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

main().catch((e) => setStatus(e.message));
</script>
</body>
